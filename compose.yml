services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - SF_WIZARD_DATA_DIR=/data
      - SF_WIZARD_RUNTIME=docker
    volumes:
      - ./data:/data
    restart: no

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:80"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: no
